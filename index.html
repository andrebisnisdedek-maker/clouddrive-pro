<!DOCTYPE html>
<html>
<head>
    <title>Cloud Drive 1TB</title>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 50px;
        }
        .box {
            background: #1e293b;
            padding: 30px;
            border-radius: 15px;
            width: 350px;
            margin: auto;
        }
        .bar {
            background: #334155;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 20px;
        }
        .fill {
            width: 30%;
            background: #22c55e;
            padding: 10px 0;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Cloud Drive 1TB</h2>
    <p>Kapasitas Terpakai</p>
    <div class="bar">
        <div class="fill">300 GB / 1 TB</div>
    </div>
</div>

</body>
</html>
